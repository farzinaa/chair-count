[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chair-counter"
version = "0.1.0"
description = "Count chairs by type in ASCII apartment floor plans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chair-counter = "chair_counter.__main__:main"

[tool.setuptools]
packages = ["chair_counter"]
